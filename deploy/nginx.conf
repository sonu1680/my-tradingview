# nginx site for the XAUUSDm chart terminal.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/xauusd-chart
#   sudo ln -s /etc/nginx/sites-available/xauusd-chart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d chart.example.com` afterwards; it rewrites
# this file in place and adds the 443 server block.

server {
    listen 80;
    server_name chart.example.com;

    # The candle payloads are large JSON arrays — a 3000-bar page is ~400 KB
    # uncompressed and compresses to roughly a tenth of that.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # The FIRST request for a timeframe parses its CSV: M1 is 140 MB and
        # takes ~2.9 s cold. Every later request is served from memory in
        # milliseconds, so this only has to cover the cold path.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Immutable hashed build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
